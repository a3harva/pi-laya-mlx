<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Guard</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --border: #dcdcd6;
    --allow: #1f7a3d; --allow-bg: #e5f3ea; --block: #b42318; --block-bg: #fbe9e7; --bar: #8a8a84; --accent: #2b59c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --border: #34342f;
      --allow: #5fcf86; --allow-bg: #17301f; --block: #ff7a6b; --block-bg: #3a1a16; --bar: #77776f; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .status { font-size: 13px; color: var(--muted); }
  .status b { color: var(--allow); } .status b.down { color: var(--block); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .row > div { flex: 1 1 160px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-height: 90px; resize: vertical; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { font-size: 12px; color: var(--muted); margin-left: 10px; }
  .verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .badge { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; border-radius: 6px; }
  .badge.allow { color: var(--allow); background: var(--allow-bg); } .badge.block { color: var(--block); background: var(--block-bg); }
  .meta { color: var(--muted); font-size: 13px; }
  .reason { margin: 12px 0 0; font-size: 14px; }
  .probs { margin-top: 14px; display: grid; grid-template-columns: 100px 1fr 48px; gap: 6px 10px; align-items: center; font-size: 13px; }
  .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); }
  .fill.top { background: var(--block); } .fill.routine { background: var(--allow); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .error { color: var(--block); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: top; }
  td.cmd { font-family: ui-monospace, Menlo, monospace; word-break: break-all; cursor: pointer; }
  td.d { font-weight: 700; width: 52px; } td.d.allow { color: var(--allow); } td.d.block { color: var(--block); }
  td.r { width: 90px; color: var(--muted); white-space: nowrap; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Laya Guard</h1>
    <div class="status" id="status">checking server…</div>
  </header>

  <section>
    <form id="form">
      <div class="row">
        <div>
          <label for="tool">Tool</label>
          <select id="tool">
            <option value="bash">bash</option>
            <option value="write">write</option>
            <option value="edit">edit</option>
            <option value="custom">other (JSON input)</option>
          </select>
        </div>
        <div id="customToolBox" hidden>
          <label for="customTool">Tool name</label>
          <input id="customTool" placeholder="e.g. fetch">
        </div>
        <div>
          <label for="cwd">Working directory</label>
          <input id="cwd" value="/Users/me/project">
        </div>
      </div>

      <div id="pathBox" class="row" hidden>
        <div><label for="path">Path</label><input id="path" placeholder="src/index.ts"></div>
      </div>
      <div class="row">
        <div>
          <label for="input" id="inputLabel">Command</label>
          <textarea id="input" placeholder="npm test" autofocus></textarea>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="threshold">Threshold <span id="thresholdValue"></span></label>
          <input id="threshold" type="range" min="0.05" max="0.99" step="0.01">
        </div>
        <div>
          <label for="apiKey">API key (only if the server needs one)</label>
          <input id="apiKey" type="password" autocomplete="off">
        </div>
      </div>
      <button id="submit">Check</button><span class="hint">⌘/Ctrl + Enter</span>
    </form>
  </section>

  <section id="result" hidden></section>

  <section id="historyBox" hidden>
    <h2>History</h2>
    <table><tbody id="history"></tbody></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let serverThreshold = 0.5;

const fields = {
  bash: { label: "Command", key: "command", path: false, placeholder: "npm test" },
  write: { label: "File content", key: "content", path: true, placeholder: "file contents…" },
  edit: { label: "New text", key: "newText", path: true, placeholder: "replacement text…" },
  custom: { label: "Input (JSON object)", path: false, placeholder: '{"url": "https://example.com"}' },
};

function syncTool() {
  const f = fields[$("tool").value];
  $("inputLabel").textContent = f.label;
  $("input").placeholder = f.placeholder;
  $("pathBox").hidden = !f.path;
  $("customToolBox").hidden = $("tool").value !== "custom";
}

function syncThreshold() { $("thresholdValue").textContent = Number($("threshold").value).toFixed(2); }

async function health() {
  try {
    const h = await (await fetch("/health")).json();
    serverThreshold = h.threshold;
    if (!$("threshold").dataset.touched) $("threshold").value = h.threshold;
    syncThreshold();
    $("status").innerHTML = `<b>●</b> ${h.model.split("/").slice(-2).join("/")} · default threshold ${h.threshold}`;
  } catch {
    $("status").innerHTML = '<b class="down">●</b> server unreachable';
  }
}

function buildRequest() {
  const kind = $("tool").value;
  const text = $("input").value;
  let tool = kind, input;
  if (kind === "custom") {
    tool = $("customTool").value.trim() || "tool";
    input = text.trim() ? JSON.parse(text) : {};
  } else {
    input = kind === "edit" ? { edits: [{ oldText: "", newText: text }] } : { [fields[kind].key]: text };
    if (fields[kind].path) input.path = $("path").value;
  }
  return { tool, input, cwd: $("cwd").value || null, threshold: Number($("threshold").value) };
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function render(r) {
  const probs = Object.entries(r.probabilities || {}).sort((a, b) => b[1] - a[1]);
  $("result").innerHTML = `
    <div class="verdict">
      <span class="badge ${r.decision}">${r.decision}</span>
      <span>risk <b>${r.risk.toFixed(2)}</b></span>
      <span class="meta">top risk: ${esc(r.category)} · ${r.latency_ms} ms</span>
    </div>
    ${r.reason ? `<p class="reason">${esc(r.reason)}</p>` : ""}
    <div class="probs">${probs.map(([k, v]) => `
      <span>${esc(k)}</span>
      <div class="track"><div class="fill ${k === "routine" ? "routine" : k === r.category && r.decision === "block" ? "top" : ""}" style="width:${(v * 100).toFixed(1)}%"></div></div>
      <span class="num">${(v * 100).toFixed(1)}%</span>`).join("")}
    </div>`;
  $("result").hidden = false;
}

function addHistory(req, r) {
  const text = req.input.command ?? req.input.content ?? req.input.edits?.[0]?.newText ?? JSON.stringify(req.input);
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="d ${r.decision}">${r.decision}</td><td class="r">${r.risk.toFixed(2)} ${esc(r.category)}</td>
                  <td class="cmd" title="click to load">${esc(req.tool)}: ${esc(text.slice(0, 200))}</td>`;
  tr.querySelector(".cmd").onclick = () => {
    const kind = fields[req.tool] && req.tool !== "custom" ? req.tool : "custom";
    $("tool").value = kind; syncTool();
    if (kind === "custom") { $("customTool").value = req.tool; $("input").value = JSON.stringify(req.input, null, 2); }
    else { $("input").value = text; $("path").value = req.input.path || ""; }
    $("input").focus();
  };
  $("history").prepend(tr);
  $("historyBox").hidden = false;
}

async function check(e) {
  e.preventDefault();
  let req;
  try { req = buildRequest(); } catch (err) {
    $("result").innerHTML = `<p class="error">Input is not valid JSON: ${esc(err.message)}</p>`; $("result").hidden = false; return;
  }
  const headers = { "content-type": "application/json" };
  const key = $("apiKey").value;
  if (key) headers.authorization = `Bearer ${key}`;
  $("submit").disabled = true;
  try {
    const res = await fetch("/v1/guard", { method: "POST", headers, body: JSON.stringify(req) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : res.statusText);
    render(body); addHistory(req, body);
  } catch (err) {
    $("result").innerHTML = `<p class="error">Request failed: ${esc(err.message)}</p>`; $("result").hidden = false;
  } finally {
    $("submit").disabled = false;
  }
}

$("tool").onchange = syncTool;
$("threshold").oninput = () => { $("threshold").dataset.touched = "1"; syncThreshold(); };
$("cwd").value = store.get("laya.cwd") || $("cwd").value;
$("cwd").onchange = () => store.set("laya.cwd", $("cwd").value);
$("form").onsubmit = check;
$("input").onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("form").requestSubmit(); };
syncTool(); syncThreshold(); health(); setInterval(health, 15000);
</script>
</body>
</html>
